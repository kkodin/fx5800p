<!doctype html>
<html lang="ja" class="calculator-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>プログラム関数電卓</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=1.4.18">
<script defer src="engine.js?v=1.4.18"></script>
<script defer src="angle.js?v=1.4.18"></script>
<script defer src="basic.js?v=1.4.18"></script>
<script defer src="formulas.js?v=1.4.18"></script>
<script defer src="import.js?v=1.4.18"></script>
<script defer src="cclwrite.js?v=1.4.18"></script>
<script defer src="complete.js?v=1.4.18"></script>
<script defer src="dialog.js?v=1.4.18"></script>
<script defer src="layout.js?v=1.4.18"></script>
<script defer src="store.js?v=1.4.18"></script>
<script defer src="pickxy.js?v=1.4.18"></script>
<script defer src="proginfo.js?v=1.4.18"></script>
<script defer src="sokusetsu.js?v=1.4.18"></script>
<script defer src="senkei.js?v=1.4.18"></script>
<script defer src="curveview.js?v=1.4.18"></script>
<script defer src="app.js?v=1.4.18"></script>
</head>
<body>
<main class="calc" id="calc" aria-label="プログラム関数電卓">
  <div class="blk blk-lcd" data-blk="lcd">
  <div class="bezel">
    <div id="lcd" class="lcd">
      <div id="ind" class="ind"></div>
      <div id="screen" class="screen" aria-live="polite"></div>
      <textarea id="editor" class="editor" hidden spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" inputmode="none" aria-label="プログラム編集"></textarea>
    </div>
    <span id="ver" class="ver"></span>
    <div id="lcdResize" class="lcd-resize" role="separator" tabindex="0" aria-orientation="horizontal"
      aria-label="ディスプレイの高さ" aria-controls="screen" title="ドラッグまたは上下キーでディスプレイの高さを変更"></div>
  </div>
  <div class="bar">
    <button type="button" id="kbdBtn" class="mini" hidden>キーボードで編集</button>
    <div id="cands" class="cands" hidden aria-label="入力候補"></div>
  </div>
  </div>
  <div class="blk blk-upper" data-blk="upper">
  <div class="top">
    <div class="round">
      <span class="lab">MODE <em>SETUP</em></span>
      <button type="button" class="rkey" data-k="MODE" aria-label="MODE"></button>
    </div>
    <div class="round r2">
      <span class="lab">FUNCTION</span>
      <button type="button" class="rkey" data-k="FUNC" aria-label="FUNCTION"></button>
    </div>
    <div class="pad" aria-label="カーソル">
      <button type="button" class="p-up" data-k="UP" aria-label="上">▲</button>
      <button type="button" class="p-left" data-k="LEFT" aria-label="左">◀</button>
      <span class="replay">REPLAY</span>
      <button type="button" class="p-right" data-k="RIGHT" aria-label="右">▶</button>
      <button type="button" class="p-down" data-k="DOWN" aria-label="下">▼</button>
    </div>
  </div>
  <div id="fkeys" class="keypad fkeys"></div>
  </div>
  <div class="blk blk-nkeys" data-blk="nkeys">
  <div id="nkeys" class="keypad nkeys"></div>
  </div>
  <div class="blk blk-tabs" data-blk="tabs" hidden>
    <div class="tabs-head" role="tablist">
      <button type="button" data-tab="fn" class="on">関数</button>
      <button type="button" data-tab="prog">プログラム</button>
      <button type="button" data-tab="var">変数</button>
      <button type="button" data-tab="hist">履歴</button>
    </div>
    <div id="tabsBody" class="tabs-body"></div>
  </div>
</main>
<input type="file" id="fileIn" hidden>
<input type="text" id="kbd" class="kbd" autocapitalize="characters" autocomplete="off" aria-label="名前入力">
<div id="toast" class="toast" role="status"></div>
</body>
</html>
