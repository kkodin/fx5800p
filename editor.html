<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プログラム エディター</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="editor.css?v=1.4.20">
<script defer src="engine.js?v=1.4.20"></script>
<script defer src="basic.js?v=1.4.20"></script>
<script defer src="import.js?v=1.4.20"></script>
<script defer src="complete.js?v=1.4.20"></script>
<script defer src="zip.js?v=1.4.20"></script>
<script defer src="cclwrite.js?v=1.4.20"></script>
<script defer src="proginfo.js?v=1.4.20"></script>
<script defer src="sokusetsu.js?v=1.4.20"></script>
<script defer src="senkei.js?v=1.4.20"></script>
<script defer src="editor.js?v=1.4.20"></script>
</head>
<body>
<header class="top">
  <div class="title"><b>プログラム エディター</b><span class="sub">fx-5800P 形式</span></div>
  <div class="tools">
    <button type="button" id="bNew" title="新しいプログラム（Ctrl+Alt+N）">＋ 新規</button>
    <button type="button" id="bOpen" title="txt・ccl・cce を開く（Ctrl+O）">📂 開く</button>
    <button type="button" id="bSave" class="primary" title="保存（Ctrl+S）">💾 保存</button>
    <button type="button" id="bCheck" title="文法チェック（F7）">✔ チェック</button>
    <button type="button" id="bRun" title="電卓で実行（F5）">▶ 電卓で実行</button>
    <span class="sep"></span>
    <button type="button" id="bExport" title="CcEditor 用 txt で書き出し（Ctrl+Shift+S）">⬇ txt書出</button>
    <button type="button" id="bCcl" title="電卓（実機）へ CcLinker で送れる .ccl で書き出し">⬇ 電卓用（.ccl）</button>
    <button type="button" id="bExportAll" title="全部を txt と .ccl にして zip 1 つにまとめて書き出し">⬇ 全部書出（zip）</button>
    <span class="sep"></span>
    <label class="opt" title="-> → など、打った文字をその場で記号に変える"><input type="checkbox" id="optAuto" checked> 記号に自動変換</label>
    <button type="button" id="bKeys" title="ショートカット一覧（F1）">⌨ ショートカット</button>
    <span class="sep"></span>
    <button type="button" id="tSide" class="ptoggle" title="左の「プログラム一覧」を出す・隠す">◧ 一覧</button>
    <button type="button" id="tPal" class="ptoggle" title="右の「命令・関数」を出す・隠す">◨ パレット</button>
    <a class="calc-link" href="./" target="fx5800p-calc">電卓を開く ↗</a>
    <a class="calc-link" href="genba.html" target="fx5800p-genba">現場の座標 ↗</a>
  </div>
</header>

<div class="main">
  <aside class="side panel" id="sidePanel" data-panel="side">
    <div class="phead"><b>プログラム一覧</b><span class="grow"></span>
      <button type="button" class="pbtn" data-pact="float" title="この窓を切り離して、好きな場所へ動かす">⇱ 切り離す</button>
      <button type="button" class="pbtn" data-pact="hide" title="この窓を隠す（上の「一覧」で戻せる）">✕</button></div>
    <div class="side-head">
      <input type="search" id="search" placeholder="プログラムを探す" aria-label="プログラムを探す">
    </div>
    <div id="newBox" class="newbox" hidden>
      <label>名前 <input id="newName" maxlength="12" placeholder="例 ZAHYO" autocomplete="off"></label>
      <div class="modes"><label><input type="radio" name="newMode" value="COMP" checked> 通常（COMP）</label><label><input type="radio" name="newMode" value="Formula"> 公式（Formula）</label></div>
      <div class="row"><button type="button" id="newOk" class="primary">作る</button><button type="button" id="newCancel">やめる</button></div>
      <p id="newErr" class="err"></p>
    </div>
    <ul id="list" class="list" aria-label="プログラム一覧"></ul>
    <div class="side-foot"><span id="count"></span></div>
  </aside>

  <section class="center">
    <div class="tabbar">
      <input id="pName" class="pname" maxlength="12" aria-label="プログラム名" spellcheck="false">
      <span id="pMode" class="badge"></span>
      <span id="dirty" class="dirty" hidden>● 未保存</span>
      <span class="grow"></span>
      <button type="button" id="bDelete" class="danger" title="このプログラムを削除">🗑 削除</button>
    </div>
    <div id="delBox" class="delbox" hidden>このプログラムを削除しますか？（元に戻せません）
      <button type="button" id="delYes" class="danger">削除する</button><button type="button" id="delNo">やめる</button></div>
    <div class="code" id="codeWrap">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <div class="area">
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="プログラム"></textarea>
        <div id="ac" class="ac" hidden role="listbox" aria-label="入力候補"></div>
      </div>
    </div>
    <div class="status">
      <span id="pos">1行 1桁</span>
      <span id="size"></span>
      <span id="fsz" class="fsz" title="Ctrl＋ホイールで文字の大きさを変える（Ctrl＋0 で元に戻す）。押すと元の大きさ"></span>
      <span id="msg" class="msg"></span>
    </div>
  </section>

  <aside class="palette panel" id="palette" data-panel="pal">
    <div class="phead"><b>命令・関数</b><span class="grow"></span>
      <button type="button" class="pbtn" data-pact="float" title="この窓を切り離して、好きな場所へ動かす">⇱ 切り離す</button>
      <button type="button" class="pbtn" data-pact="hide" title="この窓を隠す（上の「パレット」で戻せる）">✕</button></div>
    <div class="pal-tabs">
      <button type="button" data-pal="cmd" class="on">命令</button>
      <button type="button" data-pal="fn">関数・記号</button>
      <button type="button" data-pal="keys">ショートカット</button>
    </div>
    <div id="pal" class="pal-body"></div>
  </aside>
</div>
<input type="file" id="fileIn" hidden multiple accept=".txt,.bas,.ccl,.cce,text/plain">
<div id="toast" class="toast" role="status"></div>
</body>
</html>
