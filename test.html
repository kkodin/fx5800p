<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>計算の試験</title>
<style>
  :root { --bg: #fff; --fg: #1b1c1f; --ok: #1a7f37; --ng: #c62828; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c1f; --fg: #e8e8e8; --ok: #5cc879; --ng: #ff7b72; --line: #333; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #sum { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; word-break: break-all; }
  .ok { color: var(--ok); } .ng { color: var(--ng); font-weight: bold; }
</style>
<script src="angle.js"></script>
<script src="geo.js"></script>
<script src="points.js"></script>
<script src="sokusetsu.js"></script>
<script src="plot.js"></script>
<script src="zip.js"></script>
<script src="import.js"></script>
<script src="cclwrite.js"></script>
<script src="engine.js"></script>
<script src="basic.js"></script>
</head>
<body>
<h1>試験（angle.js・geo.js・points.js）</h1>
<div id="sum"></div>
<table><thead><tr><th>結果</th><th>試験</th><th>期待</th><th>実際</th></tr></thead><tbody id="rows"></tbody></table>
<script>
(function () {
  'use strict';
  const A = FxAngle, G = FxGeo, rows = [];
  const near = (a, b, e) => Math.abs(a - b) <= e;
  function test(name, expect, fn, check) {
    let got, ok;
    try { got = fn(); ok = check ? check(got) : got === expect; }
    catch (e) { got = 'エラー：' + e.message; ok = expect === 'エラー'; }
    rows.push({ ok, name, expect: String(expect), got: typeof got === 'number' ? String(+got.toFixed(9)) : String(got) });
  }
  const deg = (d, m, s) => d + m / 60 + s / 3600;
  const ang = (src, v, opt) => test('角度 ' + JSON.stringify(src) + (opt ? '（度.分秒）' : ''), v, () => A.parse(src, opt), g => near(g, v, 1e-9));
  const bad = (src, opt) => test('角度 ' + JSON.stringify(src) + ' は読めない', 'エラー', () => A.parse(src, opt), () => false);

  // ---- 角度の読み取り（仕様書 2.1） ----
  ang('45-30-15', deg(45, 30, 15));
  ang('45-30-15.5', deg(45, 30, 15.5));
  ang('45-30', deg(45, 30, 0));
  ang('45°30′15″', deg(45, 30, 15));
  ang('45°30′', deg(45, 30, 0));
  ang('45°', 45);
  ang('45°30°15°', deg(45, 30, 15));
  ang('45゜30’15”', deg(45, 30, 15));
  ang('４５－３０－１５', deg(45, 30, 15));
  ang(' 45 - 30 - 15 ', deg(45, 30, 15));
  ang('45.504167', 45.504167);
  ang('45.30.15', deg(45, 30, 15));
  ang('169.41.43.5', deg(169, 41, 43.5));
  bad('45.75.00');
  ang('0-00-00', 0);
  ang('-12-30-00', -deg(12, 30, 0));
  ang('359-59-59.9', deg(359, 59, 59.9));
  ang('45.3015', deg(45, 30, 15), { dmsDot: true });
  ang('45.3', deg(45, 30, 0), { dmsDot: true });
  ang('45.30155', deg(45, 30, 15.5), { dmsDot: true });
  ang('45', 45, { dmsDot: true });
  bad('45-75-00'); bad('45-30-60'); bad('45.5-30'); bad(''); bad('abc'); bad('45--30'); bad('45°30″'); bad('45.75', { dmsDot: true });

  // ---- 角度の表示 ----
  test('表示 161.565051°', '161-33-54', () => A.format(161.5650512));
  test('表示 記号', '161°33′54″', () => A.format(161.5650512, { style: 'symbol' }));
  test('表示 繰り上がり 59.9999″', '46-00-00', () => A.format(deg(45, 59, 59.9999)));
  test('表示 360° → 0', '0-00-00', () => A.format(359.99999999));
  test('表示 負の角は 0〜360 に', '347-30-00', () => A.format(-12.5));
  test('表示 秒 1 桁', '45-30-15.5', () => A.format(deg(45, 30, 15.5), { secDigits: 1 }));
  test('表示 差（wrap なし）', '-12-30-00', () => A.format(-12.5, { wrap: false }));

  // ---- 方向角・距離 ----
  test('方向角 北', 0, () => G.azimuth({ x: 0, y: 0 }, { x: 10, y: 0 }));
  test('方向角 東', 90, () => G.azimuth({ x: 0, y: 0 }, { x: 0, y: 10 }));
  test('方向角 南', 180, () => G.azimuth({ x: 0, y: 0 }, { x: -10, y: 0 }));
  test('方向角 西', 270, () => G.azimuth({ x: 0, y: 0 }, { x: 0, y: -10 }));
  test('距離 3-4-5', 5, () => G.dist({ x: 0, y: 0 }, { x: 3, y: 4 }));

  // ---- KAIHOU と同じ例（後視 B(10,0)、器械 O(0,0)、距離 10、角度 45°） ----
  const O0 = { x: 0, y: 0 }, B0 = { x: 10, y: 0 };
  test('観測→座標 FX', 7.0710678, () => G.observe(O0, G.azimuth(O0, B0), A.parse('45'), 10).x, g => near(g, 7.0710678, 1e-6));
  test('観測→座標 FY', 7.0710678, () => G.observe(O0, G.azimuth(O0, B0), A.parse('45'), 10).y, g => near(g, 7.0710678, 1e-6));

  // ---- 器械点（仕様書 4.4） ----
  const K1 = { x: 1000, y: 2000 }, K2 = { x: 1050, y: 2080 }, TRUE = { x: 1020, y: 2040 };
  // 正しい観測値（K1 を 0 セット）
  const h2 = G.azimuth(TRUE, K2) - G.azimuth(TRUE, K1), s1 = G.dist(TRUE, K1), s2 = G.dist(TRUE, K2);
  const fsExact = G.freeStation(K1, K2, { h: 0, s: s1 }, { h: h2, s: s2 });
  test('器械点 X（誤差なし）', 1020, () => fsExact.station.x, g => near(g, 1020, 1e-6));
  test('器械点 Y（誤差なし）', 2040, () => fsExact.station.y, g => near(g, 2040, 1e-6));
  test('既知点間の差 0', 0, () => fsExact.check.diff, g => near(g, 0, 1e-6));
  test('点検 OK', true, () => fsExact.check.ok);
  // 仕様書の丸めた観測値（169-41-43、44.721、50.000）
  const fs = G.freeStation(K1, K2, { h: A.parse('0-00-00'), s: 44.721 }, { h: A.parse('169-41-43'), s: 50.000 });
  test('器械点 X（丸めた観測値、±3mm）', 1020.000, () => fs.station.x, g => near(g, 1020, 0.003));
  test('器械点 Y（丸めた観測値、±3mm）', 2040.000, () => fs.station.y, g => near(g, 2040, 0.003));
  test('既知点間 観測（丸めた観測値、±2mm）', 94.340, () => fs.check.dObs, g => near(g, 94.3398, 0.002));
  test('既知点間の差 ±2mm で点検 OK', true, () => fs.check.ok);
  test('既知点間 座標', '94.340', () => fs.check.dCoord.toFixed(3));
  test('間の角', '169.7', () => fs.check.between.toFixed(1));
  test('間の角が 150° を超えたら注意', 1, () => fs.warnings.length);

  // ---- 測設（仕様書 5.2） ----
  const ref = G.azimuth(fsExact.station, K1);
  const t1 = G.stakeout(fsExact.station, ref, { x: 1030, y: 2050 });
  const t2 = G.stakeout(fsExact.station, ref, { x: 1031.5, y: 2051.2 });
  test('No.1 水平角', '161-33-54', () => A.format(t1.h));
  test('No.1 距離', '14.142', () => t1.s.toFixed(3));
  test('No.2 水平角', '160-48-28', () => A.format(t2.h));
  test('No.2 距離', '16.053', () => t2.s.toFixed(3));
  test('No.1 方向角', '45-00-00', () => A.format(t1.az));
  // 逆算：測設の角度と距離で観測すると元の座標に戻る
  test('測設→観測で元に戻る', true, () => { const p = G.observe(fsExact.station, ref, t1.h, t1.s); return near(p.x, 1030, 1e-9) && near(p.y, 2050, 1e-9); });

  // ---- 観測に誤差があるとき ----
  const fsBad = G.freeStation(K1, K2, { h: 0, s: s1 }, { h: h2, s: s2 + 0.05 });
  test('距離が 50mm 違うと点検 NG', false, () => fsBad.check.ok);
  test('NG のとき注意が出る', true, () => fsBad.warnings.some(w => w.includes('許容値')));
  test('器械点を 0 方向で回しても同じ', true, () => {
    const r = G.freeStation(K1, K2, { h: 30, s: s1 }, { h: h2 + 30, s: s2 });
    return near(r.station.x, 1020, 1e-6) && near(r.station.y, 2040, 1e-6) && near(r.zero, G.azimuth(TRUE, K1) - 30, 1e-6);
  });

  // ---- エラー ----
  test('既知点が同じ位置', 'エラー', () => G.freeStation(K1, K1, { h: 0, s: 1 }, { h: 90, s: 1 }), () => false);
  test('距離 0', 'エラー', () => G.freeStation(K1, K2, { h: 0, s: 0 }, { h: 90, s: 1 }), () => false);
  test('観測値なし', 'エラー', () => G.freeStation(K1, K2, null, { h: 90, s: 1 }), () => false);

  // ---- 座標一覧（points.js） ----
  const PT = FxPoints;
  test('揃える 全角', 'no.3', () => PT.normKey('Ｎｏ．３'));
  test('揃える カタカナ→ひらがな', 'にげ1', () => PT.normKey('ニゲ①'));
  const pts = ['No.1', 'No.2', 'No.10', 'No.12', 'No.120', 'BM-12', '杭12', '境界杭 No.3', '逃げ①', 'K1', 'K2'].map((n, i) => ({ id: 'p' + i, name: n, x: i, y: i * 2, kind: i < 9 ? '測点' : '既知点', memo: '' }));
  const names = (q, o) => PT.search(pts, q, o).map(p => p.name).join(',');
  test('数字だけ 12', 'No.12,BM-12,杭12,No.120', () => names('12'));
  test('数字だけ 3', '境界杭 No.3', () => names('3'));
  test('丸数字を数字で 1', 'No.1,逃げ①,K1,No.10,No.12,No.120,BM-12,杭12', () => names('1'));
  test('部分一致 境界', '境界杭 No.3', () => names('境界'));
  test('全角で探す ｎｏ．１２', 'No.12,No.120', () => names('ｎｏ．１２'));
  test('カタカナの点名をひらがなで探す', 'ニゲ杭', () => PT.search([{ id: 'a', name: 'ニゲ杭', x: 0, y: 0 }], 'にげ').map(p => p.name).join(','));
  test('種類で絞る', 'K1,K2', () => names('', { kind: '既知点' }));
  test('名前順（数は数として）', 'No.1,No.2,No.10,No.12,No.120,境界杭 No.3', () => PT.search(pts, 'no.', { sort: 'name' }).map(p => p.name).join(','));
  test('最近使った点が上', 'K2,No.1', () => PT.search(pts, '', { recent: ['p10'] }).slice(0, 2).map(p => p.name).join(','));
  test('範囲 No.2〜No.12', 'No.2,No.10,No.12', () => PT.range(pts, 'No.2', 'No.12').map(p => p.name).join(','));

  const imp = t => PT.parseText(t);
  const one = (t, i) => { const r = imp(t).rows[i || 0]; return r ? [r.name, r.x, r.y, r.z, r.memo].join('|') : '（なし）'; };
  test('CSV 点名,X,Y', 'K1|1000|2000||', () => one('K1,1000.000,2000.000'));
  test('CSV Z とメモ', 'K1|1000|2000|12.5|釘', () => one('K1,1000,2000,12.5,釘'));
  test('CSV 番号,点名,X,Y,Z', 'BM-1|10|20|3|', () => one('1,BM-1,10,20,3'));
  test('タブ区切り（Excel 貼り付け）', '境界杭 No.3|1031.5|2051.2||', () => one('境界杭 No.3\t1031.5\t2051.2'));
  test('空白区切り・点名に空白', '境界杭 No.3|1031.5|2051.2||', () => one('境界杭 No.3  1031.5 2051.2'));
  test('数字だけの点名', '101|1|2||', () => one('101,1,2'));
  test('見出しの行は飛ばす', '1|0', () => { const r = imp('点名,X,Y,Z\nK1,1,2,3'); return r.rows.length + '|' + r.errors.length; });
  test('" で囲んだ欄', 'A,B|1|2||', () => one('"A,B",1,2'));
  test('負の座標・全角の数字', 'K9|-12.5|300||', () => one('K9,－12.5,３００'));
  test('読めない行はエラーに', '1|1', () => { const r = imp('K1,1,2\nK2,abc,2'); return r.rows.length + '|' + r.errors.length; });
  test('SIMA', 'SIMA|2|KI-1|-123.456|789.012', () => {
    const r = imp('G00,01,現場,\nZ00,座標データ,\nA00,\nA01,1,KI-1,-123.456,789.012,10.5,\nA01,2,KI-2,1,2,,\nA99,\n');
    return [r.format, r.rows.length, r.rows[0].name, r.rows[0].x, r.rows[0].y].join('|');
  });
  test('Shift_JIS の文字コード', '境界杭,1,2', () => PT.decode(new Uint8Array([0x8b, 0xab, 0x8a, 0x45, 0x8d, 0x59, 0x2c, 0x31, 0x2c, 0x32])));
  test('UTF-8（BOM 付き）', 'K1', () => PT.decode(new TextEncoder().encode('﻿K1')));
  test('取り込みの計画 置き換え', 'replace,add', () => PT.plan([{ name: 'K1' }], [{ name: 'K1', x: 1, y: 2 }, { name: 'K3', x: 1, y: 2 }], 'replace').map(r => r.action).join(','));
  test('取り込みの計画 別名', 'K1 (2)', () => PT.plan([{ name: 'K1' }], [{ name: 'K1', x: 1, y: 2 }], 'rename')[0].name);
  test('取り込みの計画 飛ばす', 'skip', () => PT.plan([{ name: 'K1' }], [{ name: 'K1', x: 1, y: 2 }], 'skip')[0].action);
  test('X と Y を入れ替え', '2|1', () => { const r = PT.plan([], [{ name: 'A', x: 1, y: 2 }], 'replace', true)[0]; return r.x + '|' + r.y; });
  test('CSV 書き出し', '点名,X,Y,Z,種類,メモ\r\n"A,B",1.000,2.000,,既知点,\r\n', () => PT.toCsv([{ name: 'A,B', x: 1, y: 2, z: null, kind: '既知点', memo: '' }]));
  test('絞り込み 500 点が 30ms 以内', true, () => {
    const many = []; for (let i = 0; i < 500; i++) many.push({ id: 'm' + i, name: (i % 3 ? 'No.' : '杭') + i, x: i, y: i, kind: '測点', memo: '' });
    const t0 = performance.now(); for (let k = 0; k < 10; k++) PT.search(many, String(k + 10)); return (performance.now() - t0) / 10 < 30;
  });

  // ---- 測設のまとめ（sokusetsu.js） ----
  const SK = FxSokusetsu;
  const baseCalc = () => ({
    k1: { name: 'K1', x: 1000, y: 2000 }, k2: { name: 'K2', x: 1050, y: 2080 },
    o1: { h: '0-00-00', s: '44.721' }, o2: { h: '169.41.43', s: '50.000' },
    targets: [{ id: 't1', name: 'No.1', mode: 'xy', x: 1030, y: 2050 }, { id: 't2', name: '観測1', mode: 'obs', h: '161-33-54', s: '14.142' }]
  });
  const r1 = SK.compute(baseCalc(), { tol: 0.01 });
  // 観測値は mm・秒に丸めてあるので、器械点が 1mm ほどずれ、角度は数秒ずれる → ±5 秒で判定
  const angNear = (expect, fn) => (name) => test(name + '（±5秒）', expect, fn, g => Math.abs(A.norm180(g - A.parse(expect))) * 3600 <= 5);
  test('まとめ：器械点が決まる', true, () => r1.ready);
  angNear('161-33-54', () => r1.targets[0].h)('まとめ：No.1 の角度');
  test('まとめ：No.1 の距離（±2mm）', '14.142', () => r1.targets[0].s.toFixed(3), g => Math.abs(+g - 14.142) <= 0.002);
  test('まとめ：観測から X（±3mm）', 1030, () => r1.targets[1].x, g => near(g, 1030, 0.003));
  test('まとめ：観測から Y（±3mm）', 2050, () => r1.targets[1].y, g => near(g, 2050, 0.003));
  test('まとめ：入力が足りないと案内', '既知点2の角度・距離を入れてください', () => { const c = baseCalc(); c.o2.s = ''; return SK.compute(c, {}).error; });
  test('まとめ：角度の書き違い', true, () => { const c = baseCalc(); c.o1.h = '0-75-00'; return /分は 60/.test(SK.compute(c, {}).obs1.errH); });
  test('まとめ：距離 0', '距離は 0 より大きくしてください', () => { const c = baseCalc(); c.o1.s = '0'; return SK.compute(c, {}).obs1.errS; });
  test('まとめ：度.分秒の設定', true, () => { const c = baseCalc(); c.o2.h = '169.4143'; return SK.compute(c, { dmsDot: true }).ready && near(SK.compute(c, { dmsDot: true }).station.x, 1020, 0.003); });
  angNear('161-33-54', () => SK.compute(baseCalc(), { zero: 'raw' }).targets[0].h)('まとめ：器械の読みのまま（K1=0 なら同じ角度）');
  angNear('191-33-54', () => { const c = baseCalc(); c.o1.h = '30-00-00'; c.o2.h = '199-41-43'; return SK.compute(c, { zero: 'raw' }).targets[0].h; })('まとめ：器械の読みのまま（K1=30°）');
  angNear('161-33-54', () => { const c = baseCalc(); c.o1.h = '30-00-00'; c.o2.h = '199-41-43'; return SK.compute(c, { zero: 'k1' }).targets[0].h; })('まとめ：K1 を 0 にする（K1=30° でも）');
  test('まとめ：誤差のない観測なら秒まで一致', '161-33-54', () => { const T = { x: 1020, y: 2040 }, c = baseCalc(); c.o1 = { h: '0', s: String(G.dist(T, c.k1)) }; c.o2 = { h: String(G.azimuth(T, c.k2) - G.azimuth(T, c.k1)), s: String(G.dist(T, c.k2)) }; return A.format(SK.compute(c, {}).targets[0].h); });
  const snap = SK.snapshot(baseCalc(), r1, { tol: 0.01 }, 'メモ');
  test('履歴：入力と答えが残る', 'K1|2|メモ', () => [snap.k1.name, snap.targets.length, snap.memo].join('|'));
  test('履歴の CSV（見出し＋測点 2 行）', 3, () => SK.historyCsv([Object.assign({ time: '2026-11-22T00:00:00Z' }, snap)], v => A.format(v)).trim().split('\r\n').length);

  // ---- SIMA の書き出し・zip ----
  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join(' ');
  test('Shift_JIS：漢字', '8b ab 8a 45 8d 59', () => hex(PT.encodeSjis('境界杭').bytes));
  test('Shift_JIS：丸数字・半角カナ', '87 40 b1', () => hex(PT.encodeSjis('①ｱ').bytes));
  test('Shift_JIS：ない文字は ? にして数える', '3f|1', () => { const r = PT.encodeSjis('😀'); return hex(r.bytes) + '|' + r.lost; });
  test('SIMA：書いて読み直すと同じ点', '境界杭 No.3|1031.5|2051.2|12.3;K1|1000|2000|', () => {
    const src = [{ name: '境界杭 No.3', x: 1031.5, y: 2051.2, z: 12.3 }, { name: 'K1', x: 1000, y: 2000, z: null }];
    const back = PT.parseText(PT.decode(PT.encodeSjis(PT.toSima(src, '試験')).bytes));
    return back.format === 'SIMA' ? back.rows.map(r => [r.name, r.x, r.y, r.z == null ? '' : r.z].join('|')).join(';') : 'SIMA と読めない';
  });
  test('zip：CRC32', 'cbf43926', () => FxZip.crc32(new TextEncoder().encode('123456789')).toString(16));
  test('zip：中身の並び（先頭 PK・2 ファイル）', 'PK|2', () => {
    // Blob を同期で読めないので、作る前のデータで確かめる
    const b = FxZip.make([{ name: 'A.txt', data: 'abc' }, { name: '日本.txt', data: new Uint8Array([1, 2]) }]);
    return (b.size === 30 + 5 + 3 + 30 + 10 + 2 + 46 + 5 + 46 + 10 + 22 ? 'PK' : 'size ' + b.size) + '|2';
  });

  // ---- 電卓用の書き出し（cclwrite.js）と電卓版の測設プログラム ----
  const CC = FxCcl;
  test('.ccl：SUB2 と同じバイト列', '2a 01 32 35', () => hex(CC.toCcl({ name: 'SUB2', mode: 'COMP', source: 'C→A:D→B:X→C:Y→D' }).bytes.slice(0, 4)));
  test('.ccl：SUB2 の検査値', 'C0|7D', () => { const b = CC.toCcl({ name: 'SUB2', mode: 'COMP', source: 'C→A:D→B:X→C:Y→D' }).bytes; return String.fromCharCode(b[41], b[42]) + '|' + String.fromCharCode(b[b.length - 2], b[b.length - 1]); });
  test('.ccl：ファイル名', 'SUB2 COMP 0010.ccl', () => CC.toCcl({ name: 'SUB2', mode: 'COMP', source: 'C→A:D→B:X→C:Y→D' }).fileName);
  test('.ccl：引き算と負の記号', '87 31 99 32 22 87 41 22', () => hex(CC.encode('-1-2"-A"').bytes));
  test('.ccl：文字列の中の θ と外の θ', '22 e6 47 22 ce', () => hex(CC.encode('"θ"θ').bytes));
  test('.ccl：行の終わりの Then', 'f7 01 0d 41', () => hex(CC.encode('Then\nA').bytes));
  test('.ccl：To・Step', 'f7 04 31 0e 49 f7 05 4e f7 06 32', () => hex(CC.encode('For 1→I To N Step 2').bytes));
  test('.ccl：日本語は書き出せない', true, () => !CC.toCcl({ name: 'A', source: '"距離"?→A' }).ok);
  test('.ccl：表にない命令は書き出せない', '「DimZ」', () => (CC.encode('DimZ 5').problems[0] || { msg: '' }).msg.slice(0, 6));
  test('.ccl：名前は英大文字', false, () => CC.toCcl({ name: 'abc', source: '1' }).ok);
  test('.ccl：呼び出し先がないと注意', 'warn', () => CC.check([{ name: 'A', source: 'Prog "B"' }]).list[0].problems[0].level);
  test('.cce：書いて読み直すと同じ', true, () => { const p = { name: 'KAIHOU', source: '"-FX-":X◢J+D→Y\n?→K:K=0⇒Prog "SUB2"\n"θ"?H' }; return FxImport.decodeCce(new TextEncoder().encode(CC.toCce(p).text).buffer, 'KAIHOU.cce').source === p.source; });
  const SP = SK.calcProgram();
  test('電卓版の測設：全部 .ccl にできる', '', () => CC.toCcl(SP).problems.map(p => p.msg).join('／'));
  test('電卓版の測設：文法チェック', true, () => FxBasic.check(SP.source));
  // 電卓の画面と同じ実行部分で動かす（例題：K1・K2、観測 0-00-00/44.721、169-41-43/50、測点 No.1）
  // 答えはアプリの測設と同じ（既知点間の差 -0.3 mm、No.1 は 161-33-56・14.142。丸めた観測値なので 161-33-54 から 2 秒ずれる）
  test('電卓版の測設：例題の答え', 'DIFF(MM)|-0.349|OX|1020.000|OY|2040.000|HA|161°33\'55.9936"|HD|14.142', () => {
    const vars = { Ans: 0, __z: [], __dim: 0 }; for (const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') vars[L] = 0;
    const shown = [], io = { print: t => shown.push(t), printValue: t => shown.push(t), locate() {}, cls() {} };
    const inputs = ['1000', '2000', '1050', '2080', '0', '44.721', '169°41°43°', '50', '1030', '2050'];
    const g = FxBasic.run(SP, { vars, io });
    let r = g.next(), guard = 0;
    while (!r.done && guard++ < 100) {
      if (r.value.type === 'input') { if (!inputs.length) break; r = g.next(inputs.shift()); } else r = g.next();
    }
    return shown.map(s => String(s).trim()).join('|');
  });

  // ---- 図（plot.js） ----
  const PL = FxPlot;
  const pp = [
    { id: 'st', x: 0, y: 0, role: 'station' }, { id: 'k1', x: 100, y: 0, role: 'known' }, { id: 'k2', x: 0, y: -80, role: 'known' },
    { id: 'a', x: 1, y: 1, role: 'target' }, { id: 'b', x: 2, y: 0.5, role: 'target' }, { id: 'c', x: -1.5, y: 1.2, role: 'target' }
  ];
  const dp = PL.place(pp, 'deform', 'st');
  const byId = id => dp.find(q => q.p.id === id);
  test('デフォルメ：方向はそのまま', true, () => pp.filter(p => p.id !== 'st').every(p => { const q = byId(p.id); return near(Math.atan2(q.u, q.v), Math.atan2(p.y, p.x), 1e-9); }));
  test('デフォルメ：いちばん遠い点が半径 1', 1, () => Math.hypot(byId('k1').u, byId('k1').v), g => near(g, 1, 1e-9));
  test('デフォルメ：遠い順は変わらない', true, () => { const r = id => Math.hypot(byId(id).u, byId(id).v); return r('k1') > r('k2') && r('k2') > r('b') && r('b') > r('c') && r('c') > r('a'); });
  test('デフォルメ：2 m の測点が 100 m の既知点の 1/5 以上に見える', true, () => Math.hypot(byId('b').u, byId('b').v) > 0.2);
  test('実縮尺：座標のまま（右＝Y、上＝X）', '1|1', () => { const q = PL.place(pp, 'real', 'st').find(q => q.p.id === 'a'); return q.u + '|' + q.v; });
  test('画面に収める：全部の点が枠の中', true, () => {
    const f = PL.fitTo(dp, 300, 200);
    return dp.every(q => { const x = 150 + (q.u - f.cu) * f.s, y = 100 - (q.v - f.cv) * f.s; return x >= 0 && x <= 300 && y >= 0 && y <= 200; });
  });
  test('縮尺の目盛り：きりのよい長さ', '20', () => String(PL.niceBar(4)));

  // ---- 表示 ----
  const ng = rows.filter(r => !r.ok).length;
  document.getElementById('sum').innerHTML = ng ? '<span class="ng">✗ ' + ng + ' 件 不合格</span>（全 ' + rows.length + ' 件）' : '<span class="ok">✓ 全 ' + rows.length + ' 件 合格</span>';
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  document.getElementById('rows').innerHTML = rows.map(r => '<tr><td class="' + (r.ok ? 'ok">✓' : 'ng">✗') + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.expect) + '</td><td>' + esc(r.got) + '</td></tr>').join('');
  window.TEST_RESULT = { total: rows.length, ng, failed: rows.filter(r => !r.ok) };
})();
</script>
